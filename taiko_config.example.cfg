# TaikoRecomp configuration. The executable creates this as taiko_config.cfg
# beside itself when missing. On a version change it rewrites known keys into
# the current schema and drops obsolete/unknown keys. Environment variables
# override matching values for one-off runs. Changes take effect on next launch,
# except audio offset hotkeys which update offset_ms here immediately.

[meta]
config_version = 2

[game]
# Accelerate frame-paced boot work until the first attract audio decode.
boot_fast = 1
offline_complete = 1
plus_standalone = 1
host_frontend = 1

[songs]
# Folder containing TJA/category/song assets. Blank uses USRDIR/custom_songs.
custom_folder =
# osu!lazer storage folder (containing client.realm). Blank auto-detects it;
# set to 0 to disable osu!lazer songs. The existing library is read in place.
osu_lazer =
# Nijiiro install, Data/x64, or fumen folder. Blank disables this source.
nijiiro =
# Optional AES keys for data-only libraries. A full install can supply them
# automatically from its arcade loader. Decrypted files need no keys.
nijiiro_fumen_key =
nijiiro_datatable_key =

[network]
# Leave host blank for offline play.
host =
port = 443
verify = 0
cacert =
pairing_token =
# Leave blank to derive a stable ID from the machine hostname.
cabinet_id =
dns_loopback = 1

[audio]
decode = 1
spu = 1
offset_ms = 0
lookahead_blocks = 4
pcm_cache_mb = 512
async_previews = 1
# Linux appliance example: hw:CARD=vc4hdmi0,DEV=0
alsa_direct_device =

[video]
# Blank lets SDL choose the native driver. Wine users normally choose vulkan.
gpu_driver =
fullscreen = 0
hide_cursor = 1
present_mode =
frames_in_flight =
vblank_hz = 60
boot_vblank_hz = 240
animation_timing = 1
perf_overlay = 0
character_outline = 1
character_filter_scissor = 0

[input]
hit_value = 0x0FFF
hit_hold = 3

[runtime]
# Usually automatic. A development checkout can use: vfs_root = game/vfs
vfs_root =
vfs_layout =
toc_set = 0x1027c58,0x1037a88,0x1047a38
no_spill = 1
fs_yield = 0

# Any uncommon existing switch can be set verbatim here. This also provides a
# forward-compatible escape hatch for settings not yet given a named section.
[environment]
# RSX_FPS_LOG = 1
# SDL_GPU_DEBUG = 1
