# Optional systemd drop-in for a low-overhead performance run.
# Install as /etc/systemd/system/taikos.service.d/profiling.conf and reboot.
[Service]
Environment=TAIKO_PERF_OVERLAY=1
Environment=RSX_FPS_LOG=1
Environment=RSX_FRAME_PACING_TRACE=1
Environment=RSX_RECORDER_PROFILE=0
Environment=RSX_VBLANK_TRACE=1
Environment=TAIKO_GCM_COALESCE_PENDING=1
Environment=TAIKO_AUDIO_ASYNC_PREVIEWS=1
# Do not enable PPU_HLE_PROFILE for throughput measurements. Green performs
# hundreds of thousands of lightweight HLE lock calls per second; timing and
# accounting every call measurably perturbs the 120 Hz guest producer.

# RSX_RESOURCE_TRACE is intentionally omitted here. It timestamps resource
# preparation inside the per-operation loop and should only be enabled for a
# short second-stage run when [RSXFPS] reports a preparation-time problem.
# RSX_RECORDER_PROFILE=0 likewise removes several timer reads per draw while
# retaining backend FPS/KMS and presentation-pacing records.
